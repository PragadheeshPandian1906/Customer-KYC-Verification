spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    url: ${DB_MIGRATION_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    secure-cookie: true
  storage:
    root: ${KYC_STORAGE_ROOT}
    encryption-key: ${KYC_STORAGE_KEY}
    max-file-size: ${KYC_MAX_FILE_SIZE:10485760}
